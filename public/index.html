<html lang="id">
<head>

<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"></noscript>
<style>
:root{--bg:#F0FAF4;--side:#E3F5EA;--surface:#fff;--ink:#0F2718;--muted:#4D7260;--line:#C5E4CF;--accent:#1A7A3C;--on:#fff;--soft:#D6F0E0;--lime:#2EAD5C;
--body:"Plus Jakarta Sans","Amiri","Segoe UI",system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0A1A10;--side:#061209;--surface:#0E2116;--ink:#E8F5EC;--muted:#7AAF8A;--line:#1A3D24;--accent:#3DC26B;--on:#061209;--soft:#113321;--lime:#3DC26B}}
:root[data-theme=dark]{--bg:#0A1A10;--side:#061209;--surface:#0E2116;--ink:#E8F5EC;--muted:#7AAF8A;--line:#1A3D24;--accent:#3DC26B;--on:#061209;--soft:#113321;--lime:#3DC26B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input:not([type=checkbox]){font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;width:100%;margin-bottom:10px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.1;letter-spacing:-.03em;margin:0 0 8px;font-weight:800}h2{font-size:1.15rem;margin:0 0 10px}
.muted{color:var(--muted);margin:0 0 12px}.err{color:#c0392b;min-height:1.4em;margin-bottom:6px;font-size:.92rem}
.app{display:flex;height:100%}
.side{width:260px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 14px;font-size:1.4rem;font-weight:800}
.logo{width:36px;height:36px;border-radius:12px 12px 12px 4px;background:var(--accent);color:var(--on);display:grid;place-items:center}
.nav{text-align:left;padding:11px 14px;border-radius:12px;font-weight:600}.nav:hover{background:var(--soft)}.nav.active{background:var(--surface);box-shadow:0 1px 0 var(--line)}
.sp{flex:1}.who{padding:0 14px;color:var(--muted);font-size:.9rem}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:none;align-items:center;gap:12px;padding:12px 16px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.scroll{flex:1;overflow-y:auto;padding:28px 20px 40px}.wrap{max-width:760px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 22px 6px;padding:20px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}.grid .card{margin:0}
.tag{display:inline-block;background:var(--lime);color:var(--on);font-size:.8rem;font-weight:700;padding:2px 12px;border-radius:999px;margin-bottom:10px}
.btn{background:var(--accent);color:var(--on);font-weight:700;padding:12px 20px;border-radius:14px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}.btn:hover:not(:disabled){filter:brightness(1.06)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn small{display:block;font-weight:500;opacity:.7;font-size:.75rem}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.lv .btn{padding:10px 4px;text-align:center}
.row{display:flex;gap:10px;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{padding:8px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.dch{margin-bottom:28px}
.dhd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 2px 10px}.dhd b{font-size:.95em}
.dnav{display:flex;gap:6px}.dar{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:1.2em;line-height:1;color:inherit}
.dtrack{display:flex;border-radius:22px 22px 22px 6px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}.dtrack::-webkit-scrollbar{display:none}
.dsl{flex:0 0 100%;scroll-snap-align:start;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:22px 20px;color:#fff;min-height:110px;position:relative;overflow:hidden}
.dsl[data-k=dly]{background:linear-gradient(135deg,#B45309,#F59E0B)}.dsl[data-k=fast]{background:linear-gradient(135deg,#0f766e,#22d3ee)}.dsl[data-k=sorof]{background:linear-gradient(135deg,#166534,#65a30d)}.dsl[data-k=oral]{background:linear-gradient(135deg,#1e3a8a,#3b82f6)}
.dsl p{opacity:.92}.dsl .muted{color:inherit}.dsl .btn{background:#fff;color:#7a3a05}.dsl .btn:disabled{opacity:.6}
.dsl .dic{font-size:2.4em;flex:0 0 auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}.dsl .dtx{flex:1;min-width:0}.dsl h3{margin:0;font-size:1.1em}.dsl p{margin:2px 0 6px}.dsl small{font-weight:600}
.dsl.spin small{background:#fff;color:#8a4205;padding:2px 10px;border-radius:999px}.dsl.lost small,.dsl.off small{opacity:.75}.dsl .btn{flex:0 0 auto}
.ddots{display:flex;justify-content:center;gap:6px;margin-top:10px}.ddots i{width:7px;height:7px;border-radius:50%;background:var(--line);cursor:pointer;transition:all .2s}.ddots i.on{background:var(--accent);width:18px;border-radius:99px}
@media(max-width:480px){.dsl{gap:10px}.dsl .dic{font-size:1.8em}}
.tabs.sub button{padding:5px 12px;font-size:.88em;background:transparent}
.tabs button.on{background:var(--accent);color:var(--on);border-color:transparent}
.auth{max-width:400px;margin:8vh auto 0}.auth .btn{width:100%}
.bar{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.opt{display:flex;gap:12px;width:100%;text-align:left;padding:13px 16px;margin-bottom:8px;border-radius:16px;border:1px solid var(--line);background:var(--bg)}
.opt:hover{border-color:var(--accent)}.opt.sel{background:var(--soft);border-color:var(--accent)}.opt b{color:var(--accent)}
.chk{display:flex;gap:8px;align-items:center;margin:12px 0;font-size:.92rem}
.lrow{display:grid;grid-template-columns:44px 1fr auto auto;gap:12px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line)}.lrow:last-child{border:0}
.lrow.me{background:var(--soft);border-radius:12px}.rk{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-weight:800}
.r1{background:#F5C518;color:#3a2e00}.r2{background:#C9D1D9;color:#222}.r3{background:#D08B4F;color:#2b1500}
.bnav{display:none}
@media(max-width:820px){.top{display:flex;justify-content:center;padding:8px 16px}.side{display:none}.grid{grid-template-columns:1fr}
.scroll{padding:14px 14px calc(78px + env(safe-area-inset-bottom))}
.bnav{display:flex;position:fixed;z-index:30;left:0;right:0;bottom:0;background:var(--side);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bn{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:.68rem;font-weight:700;color:var(--muted)}
.bn span{font-size:1.25rem;line-height:1}.bn.active{color:var(--ink);background:var(--surface);box-shadow:0 1px 0 var(--line)}
.bn.dot::after{content:'';position:absolute;top:4px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:#ef4444;border:2px solid var(--side)}}
.anon .side,.anon .top,.anon .bnav{display:none}
.ptabs{position:sticky;top:-14px;z-index:5;background:var(--bg);padding:8px 0;margin:0 0 6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.ptabs::-webkit-scrollbar{display:none}.ptabs button{flex:none;padding:8px 12px;white-space:nowrap;font-size:.9rem}@media(max-width:560px){.ptabs{gap:4px}.ptabs button{padding:8px 9px;font-size:.82rem}}
.fold{padding:0}.fold>summary{display:flex;flex-direction:column;gap:2px;padding:16px 20px;cursor:pointer;list-style:none}.fold>summary::-webkit-details-marker{display:none}.fold>summary h2{margin:0}.fold>summary .muted{margin:0;font-size:.85rem}.fold>summary::after{content:'▾';position:absolute;right:20px;top:16px;color:var(--muted)}.fold{position:relative}.fold[open]>summary::after{content:'▴'}.fold>.avs{padding:0 20px 20px}
.slist{display:flex;flex-direction:column;gap:8px}.srow{display:grid;grid-template-columns:34px 1fr;column-gap:10px;align-items:center;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg)}.srow span{grid-row:span 2;font-size:1.4rem;text-align:center}.srow small{color:var(--muted)}.srow:hover{border-color:var(--accent)}.srow.out b{color:#c0392b}
.chips{display:flex;gap:8px;flex-wrap:wrap}.pchip{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:.9rem;opacity:.6}.pchip.on{opacity:1;border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--bg))}
.agrp{margin-bottom:12px}.agrp>summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none;padding:10px 4px}.agrp>summary::-webkit-details-marker{display:none}.agrp>summary h2{margin:0}.agrp>summary span{color:var(--muted);font-weight:700}.agrp>summary::after{content:'▾';margin-left:10px;color:var(--muted)}.agrp[open]>summary::after{content:'▴'}

/* ===== Animasi & level ===== */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(31,157,85,.7)}to{box-shadow:0 0 0 20px rgba(31,157,85,0)}}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@keyframes blink{50%{opacity:0}}
#view>*:not(.grid),.grid>.card,.lrow{animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
.btn,.opt,.nav,.tabs button,.lvl{transition:transform .15s,box-shadow .2s,filter .2s,background .2s,border-color .2s}
.btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 10px 22px -10px rgba(20,100,50,.55)}
.btn:active:not(:disabled),.opt:active:not(:disabled),.lvl:active,.nav:active,.tabs button:active{transform:scale(.95)}
.tabs button:hover{transform:translateY(-2px)}
.opt{animation:rise .4s backwards;animation-delay:calc(var(--i,0)*90ms + 300ms)}
.opt:hover:not(:disabled){transform:translateX(6px)}.opt:disabled{cursor:default}
.opt.ok{background:#1f9d55;border-color:#1f9d55;color:#fff;animation:pop .35s,glow .8s}
.opt.no{background:#d64545;border-color:#d64545;color:#fff;animation:shake .45s}
.opt.ok b,.opt.no b{color:#fff}
h2.cur::after{content:'▌';color:var(--accent);animation:blink .8s infinite}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.meta .muted{margin:0}
.chip{display:inline-block;background:var(--soft);padding:2px 14px;border-radius:999px;font-weight:700}.chip.pop{animation:pop .45s}
.fb{margin-top:12px;padding:12px 16px;border-radius:14px;font-weight:700;animation:pop .35s}
.fb.ok{background:rgba(31,157,85,.15);color:#1f9d55}.fb.no{background:rgba(214,69,69,.15);color:#d64545}
.pt{position:fixed;width:10px;height:10px;border-radius:3px;pointer-events:none;z-index:99;animation:fly .95s ease-out forwards}
.prog{height:10px;background:var(--soft);border-radius:9px;overflow:hidden}.prog i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--lime),var(--accent));border-radius:9px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lvl{position:relative;overflow:hidden;text-align:left;color:#fff;padding:14px 12px 12px;border-radius:18px;display:flex;flex-direction:column;gap:2px;min-height:136px}
.lvl.e{background:linear-gradient(135deg,#2EAD5C,#1A7A3C)}.lvl.m{background:linear-gradient(135deg,#F5A623,#E67E22)}.lvl.h{background:linear-gradient(135deg,#EF5B5B,#B3245B)}
.lvl:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 14px 26px -12px rgba(0,0,0,.45)}
.lvl .ic{font-size:1.7rem;line-height:1;transition:transform .3s}.lvl:hover .ic{transform:scale(1.3) rotate(-10deg)}
.lvl small{opacity:.9}.lvl .xp{margin-top:auto;align-self:flex-start;background:rgba(255,255,255,.24);padding:1px 10px;border-radius:999px;font-weight:800;font-size:.78rem}
.lvl .pb{display:block;height:5px;background:rgba(255,255,255,.3);border-radius:9px;margin-top:8px;overflow:hidden}.lvl .pb u{display:block;height:100%;background:#fff;border-radius:9px}
.lvl .done{position:absolute;top:10px;right:10px}
.lvl::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);transform:translateX(-130%)}
.lvl:hover::after{transform:translateX(130%);transition:transform .7s}
.res{text-align:center}.res .row{justify-content:center}.big{font-size:3.6rem;line-height:1.2;animation:pop .6s}
.rk.r1,.rk.r2,.rk.r3{background:none;font-size:1.5rem}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ===== Perbaikan: hover tidak menggeser elemen (mencegah goyang di tepi tombol) ===== */
.btn:hover:not(:disabled),.tabs button:hover,.opt:hover:not(:disabled){transform:none}
.btn:hover:not(:disabled){filter:brightness(1.08);box-shadow:0 8px 20px -10px rgba(20,100,50,.6)}
.tabs button:hover{border-color:var(--accent)}
.opt:hover:not(:disabled){box-shadow:inset 4px 0 0 var(--accent)}
.lvl:hover{transform:scale(1.03)}
.btn:active:not(:disabled),.opt:active:not(:disabled),.lvl:active,.nav:active,.tabs button:active{transform:scale(.97)}
.auth,.auth *{animation:none!important}
/* ===== Warna per jilid (mengikuti sampul buku) ===== */
.jc{border-top:5px solid var(--c)}
.jc .tag{background:var(--c);color:var(--fg,#fff)}
.jc .bar i{background:var(--c)}
.lvl{color:var(--fg,#fff)}
.lvl.e{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 65%,#fff),var(--c))}
.lvl.m{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 78%,var(--d)))}
.lvl.h{color:#fff;background:linear-gradient(135deg,var(--d),color-mix(in srgb,var(--d) 60%,#000))}
.lvl .xp{white-space:nowrap;padding:1px 8px;font-size:.74rem;background:color-mix(in srgb,currentColor 18%,transparent)}
.lvl .pb{background:color-mix(in srgb,currentColor 25%,transparent)}.lvl .pb u{background:currentColor}
.urow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.urow:last-child{border:0}
.del{padding:8px 16px;color:#c0392b}.nofx .lrow{animation:none}
/* ===== Kredit ===== */
.credit{text-align:center;color:var(--muted);font-size:.8rem;letter-spacing:.02em;line-height:1.4}.credit b{color:var(--accent);font-weight:700}
.scroll{display:flex;flex-direction:column}.wrap{width:100%;flex:1 0 auto}
.scroll>.credit{padding:28px 0 0}.side .credit{text-align:left;padding:8px 14px 0}
@media(min-width:821px){body:not(.anon) .scroll>.credit{display:none}}
/* ===== Logo brand ===== */
.brand{padding:0 4px 14px}.brand img{display:block;width:100%;max-width:210px}
.top-logo{display:block;height:40px;width:auto}
.auth-logo{display:block;width:min(300px,85%);margin:0 auto 12px}
/* ===== Daftar rank ===== */
.ranks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.rnk{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:12px 4px;border-radius:16px;border:1px solid var(--line);background:var(--bg)}
.rnk .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--soft);color:var(--muted);margin-bottom:4px}
.rnk small{color:var(--muted);font-weight:600}
.rnk.done .dot,.rnk.cur .dot{background:var(--accent);color:var(--on)}
.rnk.cur{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 1px var(--accent)}.rnk.cur .dot{animation:pop .5s}
.rnk.lock{opacity:.6}
@media(max-width:560px){.ranks{grid-template-columns:1fr}.rnk{flex-direction:row;text-align:left;gap:12px;padding:10px 14px}.rnk .dot{margin:0}.rnk small{margin-left:auto}}
/* ===== Rank liga ===== */
.rnk.done .dot,.rnk.cur .dot{background:var(--rc);color:#1a1a1a;font-size:1.25rem}
.rnk.cur{border-color:var(--rc);background:var(--soft);box-shadow:inset 0 0 0 2px var(--rc)}
.rnk.cur b{color:var(--ink)}
/* ===== Endless ===== */
.endless{display:flex;justify-content:space-between;align-items:center;gap:16px;color:#fff;border:0;background:linear-gradient(135deg,#3b1d8f,#c2317a)}
.endless h2{margin:6px 0 4px}.endless p{margin:0 0 6px;opacity:.92}.endless small{opacity:.9;font-weight:700}
.endless .tag{background:rgba(255,255,255,.22);color:#fff}.endless .btn{background:#fff;color:#3b1d8f;flex:none}
.end{border-top:5px solid #c2317a}.end .meta .chip{font-size:1.05rem}.chip.shk{animation:shake .45s}
@media(max-width:560px){.endless{flex-direction:column;align-items:stretch}}
/* ===== Profil, toast, panduan, tahap Tathbiq ===== */
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;font-size:1.1rem;flex:none}.av.lg{width:84px;height:84px;font-size:2.6rem}
#who{display:flex;align-items:center;gap:10px}#who>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.un{display:flex;align-items:center;gap:8px;min-width:0}
.prof{display:flex;align-items:center;gap:18px}.prof h1{margin:0 0 6px}.prof .muted{margin:8px 0 0}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}.avb{border-radius:50%;padding:3px;border:3px solid transparent;display:grid}.avb .av{width:100%;height:auto;aspect-ratio:1;font-size:1.5rem}.avb.on{border-color:var(--accent)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.ac{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 8px;border-radius:16px;border:1px solid var(--line);background:var(--bg);opacity:.5}.ac span{font-size:1.8rem}.ac small{color:var(--muted)}
.ac.on{opacity:1;border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 24px))}
.toast{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:14px;padding:12px 14px;box-shadow:0 12px 30px -12px rgba(0,0,0,.4);animation:rise .35s}.toast>span{font-size:1.5rem}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:22px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:22px;animation:pop .3s}
.gl{padding-left:20px;margin:0 0 8px}.gl li{margin-bottom:6px}
/* ===== Efek foto profil (naik seiring pencapaian) ===== */
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes aura{0%,100%{box-shadow:0 0 calc(var(--t)*2) 0 var(--c1)}50%{box-shadow:0 0 calc(var(--t)*4.5) calc(var(--t)*.6) var(--c1)}}
@keyframes bob{50%{transform:translateX(-50%) translateY(-3px) rotate(-10deg)}}
.av.md{width:52px;height:52px;font-size:1.6rem}
.avw{--sz:32px;--t:3px;position:relative;display:inline-grid;flex:none;border-radius:50%;isolation:isolate}
.avw.md{--sz:52px;--t:4px}.avw.lg{--sz:84px;--t:5px}
.avw::before{content:'';position:absolute;inset:calc(var(--t)*-1);border-radius:50%;z-index:-1;background:var(--c1)}
.avw.t2::before,.avw.t3::before,.avw.t4::before{background:conic-gradient(var(--c1),var(--c2),var(--c1));animation:spin 4s linear infinite}
.avw.t2,.avw.t3,.avw.t4{animation:aura 2.4s ease-in-out infinite}
.avw.fx4::before{background:conic-gradient(#C5DA2B,#2BA3E6,#A94BC0,#F5A31A,#C5DA2B)}
.avw.t3::before{animation-duration:2.6s}.avw.t3{animation-duration:2s}
.avw.t3::after,.avw.t4::after{content:'';position:absolute;inset:calc(var(--t)*-1);border-radius:50%;z-index:2;pointer-events:none;background:radial-gradient(circle at 50% calc(var(--t)*.5),#fff 0 calc(var(--t)*.5),transparent calc(var(--t)*.65));filter:drop-shadow(0 0 2px #fff);animation:spin 2.4s linear infinite}
.avw.t4::before{background:conic-gradient(#FFF3B0,#F2B705,#B8860B,#F2B705,#FFF3B0);animation-duration:2s}
.avw.t4{animation-duration:1.6s}
.avw.t4::after{background:radial-gradient(circle at 50% calc(var(--t)*.5),#fff 0 calc(var(--t)*.5),transparent calc(var(--t)*.65)),radial-gradient(circle at 50% calc(100% - var(--t)*.5),#fff 0 calc(var(--t)*.5),transparent calc(var(--t)*.65));animation-duration:3s}
.crn{position:absolute;left:50%;top:calc(var(--sz)*-.4);transform:translateX(-50%) rotate(-10deg);font-style:normal;font-size:calc(var(--sz)*.46);line-height:1;z-index:3;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));animation:bob 2s ease-in-out infinite}
.fxg{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.fxi{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:22px 8px 12px;border-radius:16px;border:1px solid var(--line);background:var(--bg);opacity:.5}
.fxi.on{opacity:1}.fxi.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.fxi small{color:var(--muted)}
/* ===== Pilih efek bingkai ===== */
button.fxi{font:inherit;color:inherit;cursor:pointer;width:100%}button.fxi:disabled{cursor:not-allowed}button.fxi:not(:disabled):hover{border-color:var(--accent)}
/* ===== Api untuk peringkat 1 ===== */
@keyframes blaze{0%,100%{box-shadow:0 0 8px 2px #ff6a00,0 0 18px 6px rgba(255,60,0,.55)}50%{box-shadow:0 0 12px 4px #ffb300,0 0 28px 10px rgba(255,80,0,.75)}}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-5deg)}30%{transform:scale(1.15,1.4) rotate(4deg)}60%{transform:scale(.9,1.1) rotate(-3deg)}}
@keyframes flametxt{to{background-position:200% 0}}
.fire{position:relative;display:inline-grid;flex:none;border-radius:50%;isolation:isolate;animation:blaze 1s ease-in-out infinite}
.fl{position:absolute;font-style:normal;line-height:1;font-size:calc(var(--sz)*.62);z-index:-1;pointer-events:none;transform-origin:50% 90%;filter:drop-shadow(0 0 4px #ff6a00);animation:flick .7s ease-in-out infinite}
.fl.f1{left:-14%;top:-26%;animation-delay:-.2s}.fl.f2{left:50%;top:-44%;margin-left:calc(var(--sz)*-.31);animation-delay:-.45s}.fl.f3{right:-14%;top:-26%;animation-delay:-.1s}
.lrow.top1{background:linear-gradient(90deg,rgba(255,110,0,.24),rgba(255,190,0,.08));border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,120,0,.5)}
.lrow.top1:not(.hasnm) .un>.uname{background:linear-gradient(90deg,#ff3d00,#ffb300,#ff3d00);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;animation:flametxt 2s linear infinite}
/* ===== Nilai quest & kelola soal ===== */
select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;width:100%;margin-bottom:10px}textarea{resize:vertical}
.lvl .gr{font-weight:800}
.gtag{display:inline-block;font-weight:800;padding:2px 14px;border-radius:999px;color:#1a1a1a;margin:0 0 10px}
.qrow{align-items:flex-start}.qrow .chk{margin:4px 0 0}.qrow .btn{flex:none;padding:8px 16px}
.qopt{margin:4px 0 0;font-size:.85rem}.qopt b{color:var(--accent)}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}

/* ===== Efek juara 2 (petir) dan juara 3 (percikan aura) ===== */
@keyframes zapglow{0%,100%{box-shadow:0 0 8px 2px #29b6ff,0 0 18px 6px rgba(41,140,255,.5)}8%{box-shadow:0 0 16px 5px #e6fbff,0 0 34px 12px rgba(120,200,255,.9)}14%{box-shadow:0 0 6px 1px #29b6ff,0 0 14px 4px rgba(41,140,255,.4)}55%{box-shadow:0 0 8px 2px #29b6ff,0 0 18px 6px rgba(41,140,255,.5)}60%{box-shadow:0 0 18px 6px #fff,0 0 36px 14px rgba(120,200,255,.95)}66%{box-shadow:0 0 6px 1px #29b6ff,0 0 14px 4px rgba(41,140,255,.4)}}
@keyframes zapflash{0%,100%{opacity:.25;transform:scale(.8) rotate(-10deg)}8%,16%{opacity:1;transform:scale(1.3) rotate(6deg)}12%{opacity:.4}58%,64%{opacity:1;transform:scale(1.2) rotate(-6deg)}61%{opacity:.35}}
@keyframes sparkaura{0%,100%{box-shadow:0 0 8px 2px #c77dff,0 0 18px 6px rgba(199,125,255,.45)}50%{box-shadow:0 0 14px 4px #ffa6e8,0 0 28px 10px rgba(236,110,220,.7)}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(90deg)}}
.zap,.spk{position:relative;display:inline-grid;flex:none;border-radius:50%;isolation:isolate}
.zap{animation:zapglow 1.8s linear infinite}
.zap .fl{filter:drop-shadow(0 0 5px #4cc9ff);animation:zapflash 1.8s linear infinite}
.zap .fl.f1{animation-delay:-.3s}.zap .fl.f2{animation-delay:-1.1s}.zap .fl.f3{animation-delay:-.7s}
.spk{animation:sparkaura 2s ease-in-out infinite}
.spk .fl{z-index:3;font-size:calc(var(--sz)*.42);filter:drop-shadow(0 0 4px #f0a6ff);animation:twinkle 1.6s ease-in-out infinite}
.spk .fl.f1{left:-12%;top:-8%;animation-delay:-.2s}
.spk .fl.f2{left:auto;right:-12%;top:18%;margin-left:0;animation-delay:-.8s}
.spk .fl.f3{right:auto;left:8%;top:auto;bottom:-14%;animation-delay:-1.3s}
.lrow{cursor:pointer}.lrow:hover{filter:brightness(.97)}
.lrow.top2{background:linear-gradient(90deg,rgba(41,150,255,.22),rgba(120,220,255,.07));border-radius:12px;box-shadow:inset 0 0 0 1px rgba(60,170,255,.5)}
.lrow.top3{background:linear-gradient(90deg,rgba(190,100,255,.22),rgba(255,150,230,.07));border-radius:12px;box-shadow:inset 0 0 0 1px rgba(200,110,255,.5)}
.lrow.top2:not(.hasnm) .un>.uname,.lrow.top3:not(.hasnm) .un>.uname{background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;animation:flametxt 2.4s linear infinite}
.lrow.top2:not(.hasnm) .un>.uname{background-image:linear-gradient(90deg,#1e90ff,#9be7ff,#1e90ff)}
.lrow.top3:not(.hasnm) .un>.uname{background-image:linear-gradient(90deg,#a84bff,#ff9ae6,#a84bff)}
.lite .zap,.lite .spk{animation:none!important;box-shadow:0 0 12px 0 var(--gc,#29b6ff)}.lite .spk{--gc:#c77dff}
.lite .zap .fl,.lite .spk .fl{animation:none;opacity:1}
/* ===== Profil pemain (modal dari leaderboard) ===== */
.pl{display:flex;gap:16px;align-items:center;margin-bottom:14px}.pl h2{font-size:1.4rem;margin:0 0 6px}
.pst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.pst>div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}.pst b{display:block;font-size:1.15rem}.pst small{color:var(--muted)}
.pbox h3{font-size:1rem;margin:16px 0 8px}
.itg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.itm{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px 8px;border-radius:14px;border:1px solid var(--line);background:var(--bg);opacity:.4;font-size:.8rem;text-align:center;width:100%}
.itm span{font-size:1.7rem}.itm small{color:var(--tc);font-weight:800;font-size:.68rem}
.itm.own{opacity:1;border-color:var(--tc);box-shadow:inset 0 0 0 1px var(--tc)}.itm.eq::after{content:'Dipakai';position:absolute;top:-8px;right:6px;background:var(--tc);color:#fff;border-radius:999px;font-size:.62rem;font-weight:800;padding:1px 7px}
/* ===== Ikon rank (SVG) ===== */
.ri{display:inline-block;flex:none;object-fit:contain;transition:transform .3s,filter .3s}.medal .ri,.stp .dot .ri{width:100%;height:100%}
.tag .ri{width:20px;height:20px;vertical-align:-5px;margin:-4px 5px -4px -7px}
.ac .ri{width:44px;height:44px}.ac:not(.on) .ri{filter:grayscale(1)}
/* ===== Performa ===== */
.lpz,.lpz *,.lpz *::before,.lpz *::after{animation-play-state:paused!important}
.lite .avw.t2,.lite .avw.t3,.lite .avw.t4,.lite .fire{animation:none!important;box-shadow:0 0 calc(var(--t,4px)*3) 0 var(--c1,#ff6a00)}
.lite .fl{animation:none}
/* ===== Beranda (dirapikan) ===== */
.hello{margin:0 0 14px}
.hero{padding:22px;margin-bottom:26px;border-top:5px solid var(--rc)}
.hero .top2{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.hero .who{display:flex;align-items:center;gap:14px}
.hero .who small{display:block;color:var(--muted);font-weight:600;line-height:1.2}
.hero .who b{font-size:1.35rem;line-height:1.25}
.medal{width:72px;height:72px;flex:none;display:grid;place-items:center;filter:drop-shadow(0 6px 12px color-mix(in srgb,var(--rc) 55%,transparent))}
.hero .xpb{text-align:right}.hero .xpb h1{margin:0 0 6px;line-height:1}.hero .xpb h1 small{font-size:1rem;color:var(--muted);font-weight:700}
.hero .prog{height:12px;margin:18px 0 8px}
.hero .cap{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.88rem;font-weight:600;flex-wrap:wrap}
.track{--n:6;position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));margin-top:22px}
.track::before,.track::after{content:'';position:absolute;top:21px;left:calc(50% / var(--n));height:4px;border-radius:4px}
.track::before{right:calc(50% / var(--n));background:var(--line)}
.track::after{width:calc((100% - 100% / var(--n)) * var(--p));background:linear-gradient(90deg,var(--lime),var(--rc))}
.stp{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;min-width:0}

.stp.lock{opacity:.55}
.stp b{font-size:.82rem;line-height:1.2;overflow-wrap:anywhere}.stp small{color:var(--muted);font-weight:600;font-size:.72rem}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;margin:4px 0 12px}
.sec h2{margin:0;font-size:1.3rem}.sec span{color:var(--muted);font-size:.9rem}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:28px}
.mode{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:22px 22px 22px 6px;color:#fff}
.mode.dly{background:linear-gradient(135deg,#B45309,#F59E0B)}
.mode.tth{background:linear-gradient(135deg,#3b1d8f,#c2317a);grid-column:1/-1}
.mode.fst{background:linear-gradient(135deg,#0f766e,#22d3ee)}
.mode.srf{background:linear-gradient(135deg,#166534,#65a30d)}
.mode.lsn{background:linear-gradient(135deg,#1e3a8a,#3b82f6)}
.mode.off{grid-column:1/-1}
.tmr{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 2px}.tmr i{display:block;height:100%;width:100%;background:#22c55e;transform-origin:left;border-radius:99px}.tmr.low i{background:#ef4444}
.tcount{font-weight:800;font-variant-numeric:tabular-nums}.tcount.low{color:#ef4444}
.mode.off{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.mode .tag{align-self:flex-start;background:rgba(255,255,255,.22);color:inherit;margin:0}.mode.off .tag{background:var(--line)}
.mode h2{margin:4px 0 0;font-size:1.2rem;color:inherit}
.mode p{margin:0;flex:1;font-size:.92rem;opacity:.92}
.mode .ft{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.mode .ft small{font-weight:700;opacity:.95;min-width:0}
.mode .btn{flex:none;background:#fff;color:#7a3a05}.mode.tth .btn{color:#3b1d8f}.mode.off .btn{background:var(--surface);color:var(--ink)}
.mode .ico{position:absolute;right:-4px;top:-14px;font-size:5.5rem;opacity:.16;transform:rotate(12deg);pointer-events:none}
.mode small.badge{background:#fff;color:#8a4205;padding:2px 12px;border-radius:999px;opacity:1}
.jh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.jh .tag{margin:0}
.jst{font-weight:700;color:var(--muted);font-size:.88rem}
.lvl{min-height:128px}.lvl b{line-height:1.2}.lvl small{font-size:.76rem;line-height:1.25}
@media(max-width:820px){.modes{grid-template-columns:1fr}}
@media(max-width:700px){.grid.jgrid{grid-template-columns:1fr}}
@media(max-width:420px){.hero{padding:16px}.medal{width:56px;height:56px}.hero .xpb{text-align:left}.stp .dot{width:38px;height:38px}.track::before,.track::after{top:18px}.stp small{font-size:.66rem}}
/* ===== Spin hadiah ===== */
.reel{position:relative;overflow:hidden;border-radius:18px;background:var(--bg);border:1px solid var(--line);margin:14px 0;padding:12px 0}
.strip{display:flex;gap:8px;width:max-content;will-change:transform}
.pz{flex:0 0 96px;height:84px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:1.1rem;color:#fff;background:var(--pc);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.pz.win{animation:winp .6s ease-out infinite alternate;z-index:1}
.ptr{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 10px 2px var(--accent)}
@keyframes winp{to{transform:scale(1.14);filter:brightness(1.25)}}
/* ===== Efek ===== */
.gold{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#FFE27A,#F2B705);color:#3a2e00;font-weight:800;padding:2px 14px;border-radius:999px}
.shopbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.shopg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.si{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:22px 22px 22px 6px;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--tc)}
.si .stage{height:96px;border-radius:16px;display:grid;place-items:center;font-size:2.6rem;background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--tc) 30%,transparent),transparent 70%),var(--bg)}

.si h3{margin:0}.si p{margin:0;color:var(--muted);font-size:.88rem;flex:1}
.si .acts{display:flex;gap:8px}.si .acts .btn{flex:1;padding:10px 6px;font-size:.9rem}
/* ===== Gaya nama (Efek) — dipakai di leaderboard, profil pemain, chip sidebar ===== */
@keyframes nflow{to{background-position:200% 0}}
@keyframes nneon{0%,100%{text-shadow:0 0 4px #7df9ff,0 0 10px #00d4ff}50%{text-shadow:0 0 8px #d6fdff,0 0 20px #00d4ff,0 0 32px #0099ff}}
@keyframes nglitch{0%,84%,100%{transform:translate(0);text-shadow:-1px 0 #ff2d6f,1px 0 #00e5ff}88%{transform:translate(-2px,1px);text-shadow:-3px 0 #ff2d6f,3px 0 #00e5ff}92%{transform:translate(2px,-1px);text-shadow:3px 0 #ff2d6f,-3px 0 #00e5ff}96%{transform:translate(-1px,0);text-shadow:-2px 0 #ff2d6f,2px 0 #00e5ff}}
.nfx{font-weight:800}
.nfx.n_mint{color:#1fb865}
.nfx.n_ocean{color:#2b9bff}

.nfx.n_sunset{background-image:linear-gradient(90deg,#ff8a00,#ff2d6f,#ff8a00)}
.nfx.n_shimmer{background-image:linear-gradient(100deg,#b47a00 0 35%,#ffd34d 46%,#fff0a6 50%,#ffd34d 54%,#b47a00 65% 100%);animation:nflow 2.6s linear infinite;filter:drop-shadow(0 0 1px rgba(110,70,0,.75))}
.nfx.n_neon{color:#c8fbff;background:#06222e;padding:1px 10px;border-radius:999px;animation:nneon 1.6s ease-in-out infinite}
.nfx.n_blaze{background-image:linear-gradient(90deg,#ff3d00,#ffb300,#ff3d00);animation:nflow 1.6s linear infinite;filter:drop-shadow(0 0 3px rgba(255,100,0,.65))}
.nfx.n_frost{background-image:linear-gradient(90deg,#1565c0,#4db3ff,#1565c0);animation:nflow 3s linear infinite;filter:drop-shadow(0 0 3px rgba(70,170,255,.75))}

.lite .nfx{animation:none!important}
.si .stage.nm{font-size:1.5rem;padding:0 10px;text-align:center;overflow:hidden;overflow-wrap:anywhere}.si .stage.nm b{line-height:1.3}
.shopnote{margin:0 0 12px}
.si.eq{box-shadow:inset 0 0 0 2px var(--accent)}

/* lapor soal */
.rptw{text-align:right;margin:-2px 0 6px}

    <button class="bn" data-v="home"><span>🏠</span>Beranda</button><button class="bn" data-v="daily"><span>🎯</span>Harian</button><button class="bn" data-v="board"><span>🏆</span>Peringkat</button><button class="bn" data-v="shop"><span>✨</span>Efek</button><button class="bn" data-v="ach"><span>🏅</span>Capaian</button><button class="bn" data-v="profile"><span>👤</span>Profil</button>
  </nav>
</div>
<script>
const $ = s => document.querySelector(s), V = $('#view');
const LV = { easy: ['Mudah', 10, 100, '🌱', 'e'], medium: ['Sedang', 20, 200, '⚡', 'm'], hard: ['Sulit', 30, 300, '🔥', 'h'] };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let tok = null, me = null, justReg = false;
try { tok = localStorage.getItem('tk'); } catch (e) {}

/* ---------- Lapor soal ---------- */
const REPD = new Set(), RKL = { kunci: 'Kunci jawaban salah', ketik: 'Salah ketik / pilihan keliru', ambigu: 'Soal ambigu', lain: 'Lainnya' };
const rptBtn = id => REPD.has(id) ? `<button type="button" class="rpt" data-r="${id}" disabled>🚩 Terlaporkan</button>` : `<button type="button" class="rpt" data-r="${id}" title="Laporkan jika soal ini salah">🚩 Lapor</button>`;
const rptRow = id => `<div class="rptw">${rptBtn(id)}</div>`;
const bindRpts = () => document.querySelectorAll('#view [data-r]:not(:disabled)').forEach(b => b.onclick = () => openReport(+b.dataset.r));
function openReport(qid) {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box"><h2>Laporkan soal</h2><p class="muted">Ada yang salah dengan soal ini? Pilih masalahnya, admin akan memeriksa.</p>
    <div class="rkinds">${Object.entries(RKL).map(([k, t], n) => `<label><input type="radio" name="rk" value="${k}"${n ? '' : ' checked'}> ${t}</label>`).join('')}</div>
    <textarea id="rkn" rows="2" maxlength="200" placeholder="Catatan (opsional, maks 200 huruf)"></textarea>
    <div class="err" id="rke"></div><div class="row"><button class="btn ghost" id="rkx">Batal</button><button class="btn" id="rks">Kirim laporan</button></div></div>`;
  document.body.appendChild(m);
  const close = () => m.remove(); m.querySelector('#rkx').onclick = close; m.onclick = e => { if (e.target === m) close(); };
  m.querySelector('#rks').onclick = async e => {
    const b = e.currentTarget; b.disabled = true;
    try {
      await api('report', { question: qid, kind: m.querySelector('input[name=rk]:checked').value, note: m.querySelector('#rkn').value });
      REPD.add(qid); close(); toast('Laporan terkirim. Jazakumullahu khairan!', '🚩');
      document.querySelectorAll(`[data-r="${qid}"]`).forEach(x => { x.disabled = true; x.textContent = '🚩 Terlaporkan'; });
    } catch (x) {
      if (/sudah melaporkan/.test(x.message)) { REPD.add(qid); document.querySelectorAll(`[data-r="${qid}"]`).forEach(y => { y.disabled = true; y.textContent = '🚩 Terlaporkan'; }); }
      m.querySelector('#rke').textContent = x.message; b.disabled = false;
    }
  };
}
const setRep = n => {
  if (me) me.reports = Math.max(0, n);
  const nv = $('#navAdmin'); if (nv && me && me.role === 'admin') nv.textContent = 'Panel Admin' + (me.reports ? ' 🚩' + me.reports : '');
  const pb = document.querySelector('.bn[data-v="profile"]'); if (pb) pb.classList.toggle('dot', !!(me && me.role === 'admin' && me.reports));
  const tb = document.querySelector('[data-s="lap"]'); if (tb && me) tb.textContent = '🚩 Laporan' + (me.reports ? ' (' + me.reports + ')' : '');
  const gb = document.querySelector('[data-g="usr"]'); if (gb && me) gb.textContent = '👥 Murid' + (me.reports ? ' 🚩' + me.reports : '');
};
async function api(p, b) {
  const r = await fetch('/api/' + p, {
    method: b ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json', ...(tok ? { Authorization: 'Bearer ' + tok } : {}) },
    body: b ? JSON.stringify(b) : undefined
  });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && tok && p !== 'login' && p !== 'register') { tok = null; try { localStorage.removeItem('tk'); } catch (e) {} setTimeout(boot, 0); }
  if (!r.ok) throw new Error(d.error || 'Terjadi kesalahan');
  if (p === 'me' && d.rankGot) setTimeout(() => toast(`Bonus harian rank <b>${RANKS[rkOf(Object.values(d.best || {}).reduce((a, b) => a + b, 0))][1]}</b>: +${d.rankGot} ${GL}`, '🎁'), 900);
  return d;
}
const closeMenu = () => $('#app').classList.remove('open');
function go(v, a) {
  closeMenu(); if (me) renderChip();
  document.querySelectorAll('.nav[data-v], .bn[data-v]').forEach(b => b.classList.toggle('active', b.dataset.v === v));
  ({ auth: vAuth, home: vHome, board: vBoard, daily: vDaily, shop: vShop, ach: vAch, admin: vAdmin, profile: vProfile })[v](a);
  $('.scroll').scrollTop = 0;
}

/* ---------- Masuk / Daftar ---------- */
function vAuth() {
  let mode = 'login';
  V.innerHTML = `<div class="card auth"><img class="auth-logo" src="/logo.png" alt="Al-Miftah – Mudah Belajar Membaca Kitab"><p class="muted" style="text-align:center">Kuis nahwu untuk murid Madrasah Idadiyah.</p>
    <div class="tabs"><button data-m="login" class="on">Masuk</button><button data-m="reg">Daftar</button></div>
    <input id="u" placeholder="Username" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password">
    <div class="err" id="err"></div><button class="btn" id="go">Masuk</button></div>`;
  V.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
    mode = b.dataset.m;
    $('#p').setAttribute('autocomplete', mode === 'login' ? 'current-password' : 'new-password');
    V.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    $('#go').textContent = mode === 'login' ? 'Masuk' : 'Daftar';
  });
  const submit = async () => {
    try {
      const d = await api(mode === 'login' ? 'login' : 'register', { username: $('#u').value.trim(), password: $('#p').value });
      tok = d.token; try { localStorage.setItem('tk', tok); } catch (e) {}
      if (mode === 'reg') justReg = true;
      await boot();
    } catch (e) { $('#err').textContent = e.message; }
  };
  $('#go').onclick = submit;
  $('#p').onkeydown = e => { if (e.key === 'Enter') submit(); };
}

/* ---------- Efek ---------- */
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
/* Perangkat lawas: pulsa cahaya (box-shadow beranimasi) dimatikan, cincin berputar tetap jalan */
/* Kualitas efek (Tinggi/Sedang/Rendah) diatur oleh FXQ di bagian Efek 3D; kelas 'lite' dinyalakan saat kualitas Rendah. */
const pick = a => a[Math.floor(Math.random() * a.length)];
let tt;
function typeIt(el, text) {
  clearInterval(tt);
  if (RM) { el.textContent = text; return; }
  let i = 0; const dt = Math.max(8, Math.min(28, 1800 / text.length));
  el.classList.add('cur');
  tt = setInterval(() => { el.textContent = text.slice(0, ++i); if (i >= text.length) { clearInterval(tt); el.classList.remove('cur'); } }, dt);
}
function count(el, to, ms = 900) {
  if (RM) { el.textContent = to; return; }
  const t0 = performance.now();
  const f = t => { const p = Math.min((t - t0) / ms, 1); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
function burst(x, y, n = 14) {
  if (RM) return;
  n = Math.max(6, Math.round(n * Q().ns));
  const cs = ['#2EAD5C', '#F5A623', '#EF5B5B', '#4C9AFF', '#F5C518'];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i'), a = Math.random() * 6.28, d = 60 + Math.random() * 130;
    p.className = 'pt';
    p.style.cssText = `left:${x}px;top:${y}px;background:${cs[i % 5]};--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d + 50}px;--r:${Math.random() * 720}deg`;
    document.body.appendChild(p); setTimeout(() => p.remove(), 1000);
  }
}

/* ---------- Efek: efek jawaban benar (3D) ---------- */
const GL = '🪙', R = (a, b) => a + Math.random() * (b - a);
/* Kualitas efek. dpr = resolusi kanvas, ns = pengali jumlah partikel, cap = jari-jari cahaya maksimal (px), glow = bayangan tombol [blur, sebar],
   shake/flash = pengali guncangan & kilat layar (0 = mati), cull = buang sisi belakang kristal. */
const QT = {
  high: { dpr: 2, ns: 1, cap: 1e9, glow: [70, 26], shake: 1, flash: 1, cull: 0 },
  mid: { dpr: 1.25, ns: .7, cap: 120, glow: [40, 14], shake: .6, flash: .6, cull: 1 },
  low: { dpr: 1, ns: .4, cap: 70, glow: null, shake: 0, flash: 0, cull: 1 },
};
const QN = { high: 'Tinggi', mid: 'Sedang', low: 'Rendah' };
const qGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const qSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const FXQ = (() => { // mode: auto | high | mid | low. Otomatis: awal dari jenis perangkat, lalu turun sendiri bila efek terukur patah-patah.
  const mob = /Android|Mobi|iPhone|iPad/i.test(navigator.userAgent);
  const weak = (navigator.deviceMemory && navigator.deviceMemory <= 2) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4 && mob);
  let mode = qGet('fxq'), auto = qGet('fxqa');
  if (!QT[mode]) mode = 'auto';
  if (!QT[auto]) auto = weak ? 'low' : mob ? 'mid' : 'high';
  const lvl = () => (mode === 'auto' ? auto : mode), apply = () => document.documentElement.classList.toggle('lite', lvl() === 'low');
  apply();
  return {
    get mode() { return mode; }, get level() { return lvl(); },
    set(m) { mode = QT[m] ? m : 'auto'; qSet('fxq', mode); apply(); E3.refit(); },
    down() { if (mode !== 'auto' || auto === 'low') return false; auto = auto === 'high' ? 'mid' : 'low'; qSet('fxqa', auto); apply(); E3.refit(); return true; },
  };
})();
const Q = () => QT[FXQ.level], LITE = () => FXQ.level === 'low';
const N = n => Math.max(4, Math.round(n * Q().ns));
/* Alat ukur: buka situs dengan ?fps di alamatnya untuk melihat kelancaran tiap efek di pojok kiri bawah. */
const FXDBG = /[?&]fps\b/.test(location.search);
const dbg = (mean, p75, worst, peak, shed, down) => {
  let d = document.getElementById('fxdbg');
  if (!d) { d = document.createElement('div'); d.id = 'fxdbg'; d.style.cssText = 'position:fixed;left:6px;bottom:6px;z-index:200;max-width:92vw;font:11px/1.35 monospace;background:rgba(0,0,0,.78);color:#9f9;padding:5px 9px;border-radius:8px;pointer-events:none'; document.body.appendChild(d); }
  d.textContent = `kualitas ${QN[FXQ.level]}${FXQ.mode === 'auto' ? ' (otomatis)' : ''} · rata-rata ${mean.toFixed(1)} ms (${Math.round(1000 / mean)} fps) · p75 ${p75.toFixed(1)} · terburuk ${worst.toFixed(0)} ms · partikel maks ${peak}${shed ? ' · pengaman ' + shed : ''}${down ? ' · KUALITAS TURUN' : ''}`;
};
const gold = () => Math.max(0, Math.floor(totalXp() * (me.rate || 1)) + (me.bonus || 0) - (me.spent || 0));
const FXL = () => { let z = $('#fxl'); if (!z) { z = document.createElement('div'); z.id = 'fxl'; z.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:98;overflow:hidden'; document.body.appendChild(z); } return z; };
function part(x, y, o) { // satu partikel DOM (dipakai kilat layar)
  const p = document.createElement('i');
  p.style.cssText = `position:absolute;left:${x}px;top:${y}px;opacity:0;line-height:1;font-style:normal;will-change:transform,opacity;${o.c || ''}`;
  if (o.t) p.textContent = o.t;
  FXL().appendChild(p);
  p.animate(o.kf, { duration: o.ms, easing: o.e || 'ease-out', delay: o.d || 0, fill: 'forwards' }).onfinish = () => p.remove();
}
const cen = r => [r.left + r.width / 2, r.top + r.height / 2];
const flash = c => part(0, 0, { c: `width:100vw;height:100vh;background:${c};`, kf: [{ opacity: 1 }, { opacity: 0 }], ms: 420 });

/* ---------- Efek jawaban benar: sprite sheet WebP ----------
   Efek dirender sekali (dari mesin partikel 3D lama) lalu disimpan sebagai atlas WebP berkanal alpha di /fx/.

/* ---------- Endless ---------- */
function vEndless(d) {
  /* Soal dimuat per paket 30 (lengkap dengan kunci); paket berikutnya diambil saat tersisa 5 soal. Skor disinkronkan ke server per paket, saat selesai, dan saat halaman ditutup. */
  const run = d.run, Q = d.questions, ch = []; let idx = 0, n = 1, lives = 3, score = 0, correct = 0, sent = 0, more = null, ex = false, ended = false, chain = Promise.resolve();
  noteStage(1);
  const hearts = () => '❤️'.repeat(lives) + '🖤'.repeat(3 - lives);
  const sync = end => chain = chain.then(() => { const k = ch.length; return api('endless/sync', { run, from: sent, choices: ch.slice(sent), end: !!end }).then(r => { sent = k; noteAch(r && r.ach); }); }).catch(() => {});
  const hide = () => { if (!ended && ch.length > sent) fetch('/api/endless/sync', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok }, body: JSON.stringify({ run, from: sent, choices: ch.slice(sent) }) }).catch(() => {}); };
  addEventListener('pagehide', hide);
  const fin = r => { ended = true; removeEventListener('pagehide', hide); vEndResult(r); };
  const prefetch = () => { if (more || ex) return; sync(); more = api('endless/more', { run }).then(r => { if (r.questions.length) Q.push(...r.questions); else ex = true; }).catch(() => {}).finally(() => { more = null; }); };
  const draw = () => {
    const q = Q[idx];
    V.innerHTML = `<div class="card end"><div class="meta"><span class="chip" id="hp">${hearts()}</span><span class="chip" id="sc">⭐ ${score}</span></div>
      <p class="muted"><span class="chip" style="${stgStyle(n)}">${stg(n)[0]}</span> Soal #${n} · benar = +${10 * Math.ceil(n / 10)} XP</p>${rptRow(q.id)}<h2 dir="auto" id="qt"></h2><div>` +
      ['a', 'b', 'c', 'd'].map((k, i) => `<button class="opt" style="--i:${i}" data-k="${k.toUpperCase()}" dir="auto"><b>${k.toUpperCase()}</b><span>${esc(q[k])}</span></button>`).join('') +
      `</div><div id="fb"></div><div class="row"><button class="btn ghost" id="st">Berhenti</button><button class="btn" id="nx" hidden>Lanjut →</button></div></div>`;
    const h = $('#qt'), all = V.querySelectorAll('.opt'), text = q.q; bindRpts();
    typeIt(h, text);
    h.onclick = () => { clearInterval(tt); h.textContent = text; h.classList.remove('cur'); };
    $('#st').onclick = () => { sync(true); fin({ score, correct, answered: ch.length }); };
    all.forEach(b => b.onclick = () => {
      all.forEach(x => x.disabled = true); $('#st').disabled = true;
      const k = b.dataset.k, ok = k === q.answer, pts = ok ? 10 * Math.ceil(n / 10) : 0;
      ch.push(k); if (ok) { score += pts; correct++; } else lives--;
      clearInterval(tt); h.textContent = text; h.classList.remove('cur');
      [...all].find(x => x.dataset.k === q.answer).classList.add('ok');
      if (ok) { ansFx(b); $('#sc').classList.add('pop'); }
      else { b.classList.add('no'); $('#hp').classList.add('shk'); }
      $('#hp').textContent = hearts(); $('#sc').textContent = '⭐ ' + score;
      $('#fb').innerHTML = ok ? `<div class="fb ok">${pick(['Benar!', 'Masya Allah, tepat!', 'Barakallahu fiik!'])} +${pts} XP</div>`
        : `<div class="fb no">Nyawa berkurang. Jawaban yang benar: ${q.answer}</div>`;
      const over = lives <= 0; if (over) sync(true); else if (Q.length - idx - 1 <= 5) prefetch();
      const nx = $('#nx'); nx.hidden = false; nx.textContent = over ? 'Lihat hasil' : 'Lanjut →'; nx.focus();
      nx.onclick = async () => {
        if (over) return fin({ score, correct, answered: ch.length });
        if (idx + 1 >= Q.length) {
          prefetch(); await more;
          if (idx + 1 >= Q.length) { if (!ex) { alert('Gagal memuat soal berikutnya. Coba lagi.'); return; } sync(true); return fin({ score, correct, answered: ch.length, cleared: true }); }
        }
        idx++; n++; noteStage(n); draw();
      };
    });
  };
  draw();
}

  const cap = me.tcap || 2000, sc = Math.min(r.score, cap), prev = me.best['0:endless'] || 0, gain = Math.max(0, sc - prev);

  me.best['0:endless'] = Math.max(prev, sc); me.tathRaw = Math.max(me.tathRaw || 0, r.score); noteRank(t0);

const AVS = [['🦁', '#F5A31A'], ['🦅', '#2BA3E6'], ['🐪', '#D2A15B'], ['🐢', '#2EAD5C'], ['🦉', '#A94BC0'], ['🐬', '#3AA9F0'], ['🦊', '#EF7B3B'], ['🐼', '#9AA5B1'], ['🌙', '#4B4FB3'], ['📖', '#1A7A3C'], ['🕌', '#46C2B5'], ['⭐', '#F2B705']];
/* Efek foto: level efek = jumlah pencapaian (0-11). Tier 1: cincin (1-3) · 2: cincin berputar + cahaya (4-6) · 3: + titik mengorbit (7-10) · 4: emas + mahkota (11, Takhossus) */
const FXC = [['#2EAD5C', '#2EAD5C'], ['#2BA3E6', '#2BA3E6'], ['#A94BC0', '#A94BC0'], ['#F5A31A', '#C5DA2B'], ['#22A052', '#7CFFA8'], ['#2B8FE0', '#7CD3FF'], ['#A44FD0', '#E0A0FF'], ['#F08A1E', '#FFD27A'], ['#E24B3B', '#FF9A8A'], ['#E0367A', '#FF8FC0'], ['#F2B705', '#FFF3B0']];
const fxTier = n => n < 4 ? 1 : n < 7 ? 2 : n < 11 ? 3 : 4;
/* Kunci foto pribadi: 'p<versi>:<username>' (mis. p1759560000:budi). Kunci emoji tetap 'a1'..'a12'. */
const pkey = (un, v) => 'p' + v + ':' + un;
const myAv = () => me.usePhoto && me.photo ? pkey(me.username, me.photo) : me.avatar;
/* Lencana terpasang: bd = [[ikon, nama, tingkat], ...] dari server */
const bdg = bd => bd && bd.length ? `<span class="bdg">${bd.map(b => `<i title="${esc(b[1])}" style="--tc:${TIER[b[2]]}">${b[0]}</i>`).join('')}</span>` : '';
const bdgChips = bd => bd && bd.length ? `<div class="bdgs">${bd.map(b => `<span class="bc" style="--tc:${TIER[b[2]]}">${b[0]} ${esc(b[1])}</span>`).join('')}</div>` : '';
/* Toast pencapaian baru. owned = true bila Gold-nya sudah termasuk di me.bonus (dari /me atau Efek), supaya tidak dihitung dua kali. */
function noteAch(list, owned) {
  if (!list || !list.length) return;
  if (!owned) me.bonus = (me.bonus || 0) + list.reduce((s, a) => s + (a.g || 0), 0);
  list.slice(0, 3).forEach((a, i) => setTimeout(() => toast(`Pencapaian baru: <b>${esc(a.n)}</b>! +${a.g} ${GL}`, a.i), 600 + i * 700));
  if (list.length > 3) setTimeout(() => toast(`Dan <b>${list.length - 3}</b> pencapaian lainnya. Lihat di menu Pencapaian.`, '🏅'), 600 + 3 * 700);
}

const avBase = (k, sz = '', fx = 0) => {
  const pm = /^p(\d+):([A-Za-z0-9_]+)$/.exec(String(k || ''));
  const a = AVS[(parseInt(String(k || 'a1').slice(1)) - 1) || 0],
    e = pm ? `<span class="av ${sz} ph"><img src="/api/photo?u=${pm[2]}&v=${pm[1]}" alt="" decoding="async" draggable="false"></span>` : `<span class="av ${sz}" style="background:${a[1]}">${a[0]}</span>`;
  if (!(fx > 0)) return e;
  const n = Math.min(fx, 11), f = FXC[n - 1];
  return `<span class="avw ${sz} t${fxTier(n)} fx${n}" style="--c1:${f[0]};--c2:${f[1]}">${e}${n === 11 ? '<i class="crn">👑</i>' : ''}</span>`;
};
/* top = 1: api · 2: petir · 3: percikan aura (juara leaderboard). true dianggap 1 (kompatibel dengan pemanggilan lama). */

/* ---------- Kompresi foto pribadi (dikerjakan di perangkat murid, sebelum diunggah) ----------
   Tujuan: sekecil mungkin tapi tetap tajam di bingkai terbesar (84 px; layar 2x = 168 px), jadi dimulai dari 192 px.
   1) Orientasi EXIF dikoreksi, lalu dipotong persegi. Foto potret: pusat potong dinaikkan ke 35% tinggi agar wajah tidak terpotong.
   2) Diperkecil bertahap (dibagi dua tiap langkah, baru langkah akhir ke ukuran target) supaya tepi tidak bergerigi.
   3) Latar diisi warna netral (menghapus kanal alfa PNG), lalu di-encode WebP (JPEG bila browser tak bisa encode WebP, mis. Safari lama).
   4) Pencarian biner (5 langkah): kualitas tertinggi yang hasilnya masih <= PH_TARGET byte. Jika kualitas minimum pun masih
      melebihi target, turun ke ukuran berikutnya: 192 -> 160 -> 128 -> 96 px.
   Hasil umum: 4-9 KB per foto (aplikasi ini tak pernah menyimpan foto asli). */
const PH_TARGET = 9000, PH_SIZES = [192, 160, 128, 96], PH_QMIN = .5, PH_QMAX = .9;
async function loadImg(f) {
  if (window.createImageBitmap) { try { return await createImageBitmap(f, { imageOrientation: 'from-image' }); } catch (e) {} }
  const u = URL.createObjectURL(f);
  try { const i = new Image(); i.src = u; await i.decode(); return i; } finally { URL.revokeObjectURL(u); }
}
async function compressPhoto(file) {
  if (!/^image\//.test(file.type)) throw new Error('Pilih file gambar (JPG, PNG, atau WebP)');
  if (file.size > 20 * 1048576) throw new Error('Foto terlalu besar (maksimal 20 MB)');
  let img; try { img = await loadImg(file); } catch (e) { throw new Error('Foto tidak bisa dibaca. Coba format JPG, PNG, atau WebP.'); }
  const W = img.naturalWidth || img.width, H = img.naturalHeight || img.height, s = Math.min(W, H);
  if (s < 64) throw new Error('Foto terlalu kecil (minimal 64 px)');
  const sx = (W - s) / 2, sy = (H - s) * (H > W ? .35 : .5);
  const mk = n => { const c = document.createElement('canvas'); c.width = c.height = n; const g = c.getContext('2d'); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high'; return [c, g]; };
  const type = document.createElement('canvas').toDataURL('image/webp').startsWith('data:image/webp') ? 'image/webp' : 'image/jpeg';
  const blobAt = (c, q) => new Promise(ok => c.toBlob(ok, type, q));
  let best = null, last = null;
  for (const size of PH_SIZES) {
    let src = img, x = sx, y = sy, w = s;
    while (w / 2 >= size) { const n = Math.ceil(w / 2), [c, g] = mk(n); g.drawImage(src, x, y, w, w, 0, 0, n, n); src = c; x = y = 0; w = n; }
    const [c, g] = mk(size); g.fillStyle = '#eef3ef'; g.fillRect(0, 0, size, size); g.drawImage(src, x, y, w, w, 0, 0, size, size);
    let pick = await blobAt(c, PH_QMAX);
    if (pick && pick.size > PH_TARGET) {
      const lo0 = await blobAt(c, PH_QMIN);
      if (!lo0 || lo0.size > PH_TARGET) { last = { b: lo0, size }; pick = null; }
      else { pick = lo0; let lo = PH_QMIN, hi = PH_QMAX; for (let i = 0; i < 5; i++) { const mid = (lo + hi) / 2, m = await blobAt(c, mid); if (m && m.size <= PH_TARGET) { pick = m; lo = mid; } else hi = mid; } }
    }
    if (pick) { best = { b: pick, size }; break; }
  }
  if (img.close) img.close();
  best = best || last;
  if (!best || !best.b || best.b.size > 24000) throw new Error('Foto tidak bisa dikompres cukup kecil. Coba foto lain.');
  const b64 = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = no; r.readAsDataURL(best.b); });
  return { b64, size: best.size, bytes: best.b.size };
}

let achTab = 'all', achOpen = null;
async function vAch() {
  V.innerHTML = '<p class="muted">Memuat…</p>';
  let d; try { d = await api('achievements'); } catch (e) { V.textContent = e.message; return; }
  noteAch(d.newly);
  if (!achOpen) { const fi = d.groups.findIndex((g, gi) => d.list.some(a => a.g === gi && !a.got)); achOpen = new Set([fi < 0 ? 0 : fi]); }
  const DN = ['Ahad', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'], got = d.list.filter(a => a.got).length;
  const card = a => {
    const pc = a.need ? Math.round(a.v / a.need * 100) : 0;
    return `<div class="achc${a.got ? '' : ' lock'}" style="--tc:${TIER[a.t]}"><div class="ai">${a.i}</div><div class="ab"><div class="at"><b>${esc(a.n)}</b>${d.pinned.includes(a.k) ? '<span title="Terpasang di profil">📌</span>' : ''}</div><p class="muted">${esc(a.d)}</p>
      ${a.got ? `<small class="muted">Terbuka ${new Date(a.at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })}</small>` : a.h ? '' : a.np ? `<small class="muted">${d.rank ? 'Peringkatmu sekarang #' + d.rank.pos + ' dari ' + d.rank.players + ' murid.' : 'Belum masuk hitungan peringkat.'} Syarat: minimal ${d.rmin[0]} XP dan ${d.rmin[1]} murid.</small>` : `<div class="bar"><i style="width:${pc}%"></i></div><small class="muted">${a.v} / ${a.need}</small>`}</div>
      <div class="ar"><span class="tg" style="background:${TIER[a.t]}">${a.t}</span><span class="gold">${GL} ${a.gold}</span></div></div>`;
  };
  const draw = () => {
    const show = d.list.filter(a => achTab === 'all' || (achTab === 'got') === a.got);
    const body = d.groups.map((g, gi) => {
      const items = show.filter(a => a.g === gi);
      return items.length ? `<details class="agrp" data-g="${gi}"${achTab !== 'all' || achOpen.has(gi) ? ' open' : ''}><summary><h2>${g}</h2><span>${d.list.filter(a => a.g === gi && a.got).length}/${d.list.filter(a => a.g === gi).length}</span></summary><div class="achg">${items.map(card).join('')}</div></details>` : '';
    }).join('');
    V.innerHTML = `<h1>Pencapaian</h1>
      <div class="card"><div class="phrow" style="justify-content:space-between"><div><h2 style="margin:0">${got} / ${d.list.length} terbuka</h2><p class="muted" style="margin:4px 0 0">${GL} ${d.earned} Gold didapat dari pencapaian</p></div>
        <div class="acts"><span class="chip">🔥 Streak ${d.cur.streak} hari (rekor ${d.cur.best})</span><span class="chip">📅 Kuis harian ${d.cur.dstreak} hari (rekor ${d.cur.dbest})</span></div></div>
        <div class="prog" style="margin-top:12px"><i id="apg"></i></div>
        <p class="muted" style="margin:10px 0 0;font-size:.85rem">Hari aktif = ada kuis yang lulus atau kuis harian selesai (hari WIB).${d.skip >= 0 ? ' Hari ' + DN[d.skip] + ' tidak memutus streak.' : ''} Pasang sampai 3 lencana di menu Profil.</p></div>
      <div class="tabs">${[['all', 'Semua'], ['got', 'Terbuka'], ['lock', 'Terkunci']].map(([k, t]) => `<button data-at="${k}" class="${achTab === k ? 'on' : ''}">${t}</button>`).join('')}</div>` +
      (body || '<p class="muted">Tidak ada pencapaian di tab ini.</p>');
    V.querySelectorAll('[data-at]').forEach(b => b.onclick = () => { achTab = b.dataset.at; draw(); });
    V.querySelectorAll('.agrp').forEach(x => x.ontoggle = () => { if (achTab === 'all') { if (x.open) achOpen.add(+x.dataset.g); else achOpen.delete(+x.dataset.g); } });
    setTimeout(() => { const g = $('#apg'); if (g) g.style.width = got / d.list.length * 100 + '%'; }, 80);
  };
  draw();
}

        : `<p class="muted">${bq ? 'Tidak ada murid bernama "' + esc(bq) + '".' : 'Belum ada nilai.'}</p>`;
      box.onclick = e => { const r = e.target.closest('.lrow'); if (r) openPlayer(r.dataset.u, j === 0 ? +r.dataset.rk : 0); };
      box.onkeydown = e => { if (e.key === 'Enter' && e.target.classList.contains('lrow')) e.target.click(); };
      first = false;
      if (window.IntersectionObserver) { // jeda animasi baris yang tidak terlihat
        lio && lio.disconnect();
        lio = new IntersectionObserver(es => es.forEach(x => x.target.classList.toggle('lpz', !x.isIntersecting)), { rootMargin: '60px' });
        box.querySelectorAll('.lrow').forEach(r => lio.observe(r));
      }
    } catch (e) { $('#lbr').textContent = e.message; }
  };
  $('#sq').oninput = e => { bq = e.target.value.trim(); clearTimeout(t); t = setTimeout(load, 250); };

}

/* ---------- Admin ---------- */
/* Pustaka Excel besar (~900 KB): hanya dimuat di Panel Admin, bukan untuk semua murid */
/* SRI: isi dengan hasil `curl -s <URL_XLSX> | openssl dgst -sha512 -binary | openssl base64 -A`, diawali "sha512-".
   Bila diisi, browser menolak file yang isinya berubah. Kosong = tanpa pengecekan. */
const SRI = '';
let xlsxP;
const loadX = () => window.XLSX ? Promise.resolve() : xlsxP ||= new Promise((ok, no) => {
  const e = document.createElement('script'); e.src = '/vendor/xlsx.full.min.js'; if (SRI) { e.integrity = SRI; e.crossOrigin = 'anonymous'; }
  e.onload = ok; e.onerror = () => { xlsxP = null; no(new Error('Gagal memuat pustaka Excel. Periksa koneksi internet.')); };
  document.head.appendChild(e);
});
let admTab = 'stat', admSub = { bank: 'soal', usr: 'user', sys: 'ev' };
const ADM_G = () => [
  ['stat', '📊 Ringkasan', [['stat', '', adminStats]]],
  ['bank', '📚 Bank soal', [['soal', '📝 Tulis', adminSoal], ['oral', '🗣️ Lisan', adminOral], ['sorof', '🧩 Sorof', adminSorof]]],
  ['usr', '👥 Murid' + (me.reports ? ' 🚩' + me.reports : ''), [['user', '👥 Murid', adminUsers], ['lap', '🚩 Laporan' + (me.reports ? ' (' + me.reports + ')' : ''), adminReports]]],
  ['sys', '⚙️ Sistem', [['ev', '📅 Event harian', adminEvents], ['groq', '🤖 Groq', adminGroq]]]
];
function vAdmin() {
  V.innerHTML = `<h1>Panel Admin</h1><div class="tabs" id="agrp"></div><div class="tabs sub" id="asub"></div><div id="ab"></div>`;
  const draw = () => {
    const G = ADM_G();
    $('#agrp').innerHTML = G.map(([k, n]) => `<button data-g="${k}" class="${k === admTab ? 'on' : ''}">${n}</button>`).join('');
    $('#agrp').querySelectorAll('[data-g]').forEach(b => b.onclick = () => { admTab = b.dataset.g; draw(); });
    const g = G.find(x => x[0] === admTab) || G[0], subs = g[2];
    const cur = subs.find(x => x[0] === admSub[g[0]]) || subs[0];
    if (g[0] !== 'stat') admSub[g[0]] = cur[0];
    const sb = $('#asub'); sb.style.display = subs.length > 1 ? '' : 'none';
    sb.innerHTML = subs.length > 1 ? subs.map(([k, n]) => `<button data-s="${k}" class="${k === cur[0] ? 'on' : ''}">${n}</button>`).join('') : '';
    sb.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { admSub[g[0]] = b.dataset.s; draw(); });

  };

  let st = (r.steps || []).map(s => ({ q: s.q, a: s.a.join(' | '), n: s.n || '' }));

  m.innerHTML = `<div class="box"><h2>${r.id ? 'Edit lafadz' : 'Tambah lafadz'}</h2>

    <div id="oest"></div>
    <div class="row" style="margin:0 0 4px"><button class="btn ghost" id="oeadd" type="button">+ Pertanyaan</button><button class="btn ghost" id="oetpl" type="button">Isi 7 pertanyaan standar</button></div>
    <div class="err" id="oee"></div><div class="row"><button class="btn ghost" id="oex">Batal</button><button class="btn" id="oes">Simpan</button></div></div>`;
  document.body.appendChild(m);
  const pull = () => m.querySelectorAll('.ostep').forEach(b => { const i = +b.dataset.i; ['q', 'a', 'n'].forEach(f => { st[i][f] = b.querySelector(`[data-f=${f}]`).value; }); });

      <input data-f="q" dir="auto" maxlength="120" placeholder="Pertanyaan" value="${esc(s.q)}" autocomplete="off">
      <input data-f="a" dir="auto" placeholder="Jawaban benar (variasi dipisah | )" value="${esc(s.a)}" autocomplete="off">

    m.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { pull(); st.splice(+b.dataset.rm, 1); draw(); });
  };
  draw();
  const close = () => m.remove(); m.querySelector('#oex').onclick = close; m.onclick = e => { if (e.target === m) close(); };
  m.querySelector('#oeadd').onclick = () => { if (st.length >= 12) return; pull(); st.push({ q: '', a: '', n: '' }); draw(); };
  m.querySelector('#oetpl').onclick = () => { pull(); const have = new Set(st.map(s => s.q.trim())); STD_Q.forEach(q => { if (!have.has(q) && st.length < 12) st.push({ q, a: '', n: '' }); }); draw(); };

    pull(); const g = id => m.querySelector('#' + id);
    const steps = st.filter(s => s.q.trim() || s.a.trim()).map(s => ({ q: s.q.trim(), a: s.a.split('|').map(x => x.trim()).filter(Boolean), n: s.n.trim() }));
    if (steps.some(s => !s.q || !s.a.length)) { g('oee').textContent = 'Setiap pertanyaan harus punya teks pertanyaan dan minimal satu jawaban benar.'; return; }
    try {

  };

      $('#ul').querySelectorAll('.del').forEach(b => b.onclick = async () => {
        if (!confirm(`Hapus akun "${b.dataset.n}" beserta semua nilainya? Tindakan ini tidak bisa dibatalkan.`)) return;
        try { await api('admin/delete-user', { id: +b.dataset.id }); load(); } catch (e) { alert(e.message); }
      });
    } catch (e) { $('#ul').textContent = e.message; }
  };
  $('#uq').oninput = () => { clearTimeout(t); t = setTimeout(load, 250); };
  load();
}

/* ---------- Awal ---------- */
async function boot() {
  try { me = await api('me'); } catch (e) { tok = null; me = null; try { localStorage.removeItem('tk'); } catch (x) {} }
  document.body.classList.toggle('anon', !me);
  if (me) { renderChip(); warmFx(); $('#navAdmin').hidden = me.role !== 'admin'; setRep(me.reports || 0); go('home'); if (me.unseen && me.unseen.length) { noteAch(me.unseen, true); api('achievements/seen', {}).catch(() => {}); } if (me.role === 'admin' && me.reports) setTimeout(() => toast('Ada <b>' + me.reports + ' soal</b> dilaporkan murid. Buka Panel Admin → Laporan.', '🚩'), 800); let g = false; try { if (!localStorage.getItem('guide1')) { localStorage.setItem('guide1', '1'); g = true; } } catch (e) {}
    if (justReg) { justReg = false; openWelcome(g); } else if (g) openGuide(); } else go('auth');
}
document.querySelectorAll('.nav[data-v], .bn[data-v]').forEach(b => b.onclick = () => go(b.dataset.v));
function theme(t) { document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('theme', t); } catch (e) {} }
try { const t = localStorage.getItem('theme'); if (t) theme(t); } catch (e) {}
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
boot();
</script>
